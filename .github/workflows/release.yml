name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build Release (universal)
        run: UNIVERSAL=1 VERSION="${{ steps.version.outputs.VERSION }}" ./scripts/build-app.sh

      - name: Verify rendering pipeline
        run: |
          swift scripts/render-test.swift Samples/README.md /tmp/render.png | tee /tmp/inspect.txt
          grep -q '"mermaidErrors":0' /tmp/inspect.txt
          grep -q '"mermaidSvg":2' /tmp/inspect.txt

      - name: Create zip
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent Mado.app "Mado-${{ steps.version.outputs.VERSION }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Mado-${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true

  update-homebrew:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Wait for release asset
        run: sleep 10

      - name: Download release zip and compute SHA256
        id: sha
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/Mado-${{ steps.version.outputs.VERSION }}.zip"
          curl -fSL -o mado.zip "$URL"
          SHA=$(sha256sum mado.zip | awk '{print $1}')
          echo "SHA256=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: fuwasegu/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Cask
        run: |
          cat > homebrew-tap/Casks/mado.rb << 'CASK_EOF'
          cask "mado" do
            version "${{ steps.version.outputs.VERSION }}"
            sha256 "${{ steps.sha.outputs.SHA256 }}"

            url "https://github.com/${{ github.repository }}/releases/download/v#{version}/Mado-#{version}.zip"
            name "Mado"
            desc "Fast, beautiful Markdown viewer for macOS with Mermaid and OpenAPI support"
            homepage "https://github.com/${{ github.repository }}"

            depends_on macos: ">= :sonoma"

            app "Mado.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-cr", "#{appdir}/Mado.app"],
                             sudo: false
            end

            zap trash: [
              "~/Library/Preferences/dev.takeshita.mado.plist",
              "~/Library/Saved Application State/dev.takeshita.mado.savedState",
            ]
          end
          CASK_EOF

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/mado.rb
          git commit -m "Update Mado to ${{ steps.version.outputs.VERSION }}"
          git push
